asyncapi: 3.0.0
info:
  title: AphelionDMM Collaboration Stream API
  version: 1.0.0
  description: Bounded JSON durable-operation and lossy-presence stream, with negotiated bulk-edit-v2 transaction frames. Compression is disabled.
x-bulk-edit-v2:
  subprotocol: apheliondmm.collaboration.bulk-edit-v2
  negotiation: Required at join for the entire lifetime of a bulk session, even before its first edit. Legacy sessions retain their existing JSON contract. Canonical map hash, stable IDs, and operation protocol version remain unchanged.
  frames:
    begin: Binary byte 1 followed by a strict JSON object containing positive size in bytes and lowercase SHA256 digest of the complete transaction body. At most 1024 bytes including the tag.
    chunk: Binary byte 2 followed by an unsigned 64-bit big-endian sequential index starting at zero, then 1 through 65536 body bytes.
    finish: Single binary byte 3. Length, ordering and digest must verify before decoding or committing the operation.
  body: UTF-8 JSON header of at most 16384 bytes including its newline, followed by exactly count JSON TileChange records separated by newlines. Header version is 2; kind is operation_submit or operation_accepted; session_id and message_id identify the envelope; operation contains metadata with an empty changes field. Acceptance additionally carries revision, accepted_at and map_hash. Invalid UTF-8, trailing records and unknown fields are rejected.
  authority: Frames are never independent durable operations. One completed body has one operation ID, one accepted document revision and one actor-scoped inverse. Authentication and session capability precede spool allocation; the server derives actor identity from its authenticated principal.
  resources: A connection uploads one body at a time. Server-owned private spools use shared configured byte admission, strict frame deadlines and cleanup on cancellation or disconnect. Decoded bulk edits retain an aggregate working-budget reservation of 16 times verified body bytes through processing. This is conservative accounting, not a heap measurement. Admission failures close with status 1013 and required/available budget bytes before mutation. Paths never cross the wire. Small edits may use ordinary JSON envelopes.
  cancellation: Incomplete input changes no durable state. After commit, disconnection does not undo the edit; reconnect and exact operation-ID retry resolve the durable outcome.
  presence: The selection remains a compact inclusive bounding box. Bulk sessions permit whole-level selections within valid map dimensions; the v1 4096-tile area cap remains only for legacy sessions.
servers:
  loopback:
    host: 127.0.0.1
    protocol: ws
channels:
  collaboration:
    address: /v1/collaboration
    messages:
      join: { $ref: '#/components/messages/join' }
      operation_submit: { $ref: '#/components/messages/operation_submit' }
      inverse_request: { $ref: '#/components/messages/inverse_request' }
      presence_update: { $ref: '#/components/messages/presence_update' }
      profile_update: { $ref: '#/components/messages/profile_update' }
      acknowledged_revision: { $ref: '#/components/messages/acknowledged_revision' }
      ping: { $ref: '#/components/messages/ping' }
      joined: { $ref: '#/components/messages/joined' }
      operation_accepted: { $ref: '#/components/messages/operation_accepted' }
      operation_rejected: { $ref: '#/components/messages/operation_rejected' }
      replay_complete: { $ref: '#/components/messages/replay_complete' }
      presence_snapshot: { $ref: '#/components/messages/presence_snapshot' }
      session_notice: { $ref: '#/components/messages/session_notice' }
      pong: { $ref: '#/components/messages/pong' }
operations:
  receiveClientMessages:
    action: receive
    channel: { $ref: '#/channels/collaboration' }
    messages:
      - { $ref: '#/channels/collaboration/messages/join' }
      - { $ref: '#/channels/collaboration/messages/operation_submit' }
      - { $ref: '#/channels/collaboration/messages/inverse_request' }
      - { $ref: '#/channels/collaboration/messages/presence_update' }
      - { $ref: '#/channels/collaboration/messages/profile_update' }
      - { $ref: '#/channels/collaboration/messages/acknowledged_revision' }
      - { $ref: '#/channels/collaboration/messages/ping' }
  sendServerMessages:
    action: send
    channel: { $ref: '#/channels/collaboration' }
    messages:
      - { $ref: '#/channels/collaboration/messages/joined' }
      - { $ref: '#/channels/collaboration/messages/operation_accepted' }
      - { $ref: '#/channels/collaboration/messages/operation_rejected' }
      - { $ref: '#/channels/collaboration/messages/replay_complete' }
      - { $ref: '#/channels/collaboration/messages/presence_snapshot' }
      - { $ref: '#/channels/collaboration/messages/presence_update' }
      - { $ref: '#/channels/collaboration/messages/session_notice' }
      - { $ref: '#/channels/collaboration/messages/pong' }
components:
  messages:
    join: { name: join, payload: { $ref: '#/components/schemas/ClientEnvelope' } }
    operation_submit: { name: operation_submit, payload: { $ref: '#/components/schemas/ClientEnvelope' } }
    inverse_request: { name: inverse_request, payload: { $ref: '#/components/schemas/ClientEnvelope' } }
    presence_update: { name: presence_update, payload: { $ref: '#/components/schemas/Envelope' } }
    profile_update: { name: profile_update, payload: { $ref: '#/components/schemas/ClientEnvelope' } }
    acknowledged_revision: { name: acknowledged_revision, payload: { $ref: '#/components/schemas/ClientEnvelope' } }
    ping: { name: ping, payload: { $ref: '#/components/schemas/ClientEnvelope' } }
    joined:
      name: joined
      payload:
        allOf:
          - { $ref: '#/components/schemas/ServerEnvelope' }
          - type: object
            properties:
              type: { const: joined }
              payload: { $ref: '#/components/schemas/JoinedPayload' }
    operation_accepted: { name: operation_accepted, payload: { $ref: '#/components/schemas/ServerEnvelope' } }
    operation_rejected: { name: operation_rejected, payload: { $ref: '#/components/schemas/ServerEnvelope' } }
    replay_complete: { name: replay_complete, payload: { $ref: '#/components/schemas/ServerEnvelope' } }
    presence_snapshot: { name: presence_snapshot, payload: { $ref: '#/components/schemas/ServerEnvelope' } }
    session_notice:
      name: session_notice
      payload:
        allOf:
          - { $ref: '#/components/schemas/ServerEnvelope' }
          - type: object
            properties:
              type: { const: session_notice }
              payload: { $ref: '#/components/schemas/SessionNoticePayload' }
    pong: { name: pong, payload: { $ref: '#/components/schemas/ServerEnvelope' } }
  schemas:
    Envelope:
      type: object
      additionalProperties: false
      required: [protocol_version, message_id, session_id, type, payload]
      properties:
        protocol_version: { type: integer, const: 1 }
        message_id: { type: string, minLength: 1, maxLength: 128 }
        session_id: { type: string, minLength: 1, maxLength: 128 }
        type: { type: string, minLength: 1, maxLength: 128 }
        payload: { type: object }
    ClientEnvelope:
      allOf:
        - { $ref: '#/components/schemas/Envelope' }
        - type: object
          properties:
            type:
              enum: [join, operation_submit, inverse_request, presence_update, profile_update, acknowledged_revision, ping]
    ServerEnvelope:
      allOf:
        - { $ref: '#/components/schemas/Envelope' }
        - type: object
          properties:
            type:
              enum: [joined, operation_accepted, operation_rejected, replay_complete, presence_snapshot, presence_update, session_notice, pong]
    StableError:
      type: object
      additionalProperties: false
      required: [code, message, revision, map_hash]
      properties:
        code: { type: string, minLength: 1, maxLength: 128 }
        message: { type: string, minLength: 1, maxLength: 512 }
        revision: { type: integer, minimum: 0 }
        map_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
    JoinedPayload:
      type: object
      additionalProperties: false
      required: [document_id, actor_id, role, revision, map_hash, presence_interval_ms, resumption_token, resumption_token_expires_at]
      properties:
        bulk_edits: { type: boolean, default: false, description: Every participant in this session must negotiate bulk-edit-v2. }
        document_id: { type: string, minLength: 1, maxLength: 128 }
        actor_id: { type: string, minLength: 1, maxLength: 128 }
        role: { type: string, enum: [viewer, editor, owner] }
        revision: { type: integer, minimum: 0 }
        map_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        presence_interval_ms: { type: integer, minimum: 16, maximum: 5000 }
        resumption_token: { type: string, minLength: 1, maxLength: 128, description: Opaque in-memory credential rotated after every successful join or reconnect. }
        resumption_token_expires_at: { type: string, format: date-time }
    SessionNoticePayload:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
          description: snapshot_required instructs a stale client to fetch the authenticated HTTP snapshot and reconnect from that revision.
        message: { type: string, minLength: 1, maxLength: 512 }
    Coord:
      type: object
      additionalProperties: false
      required: [x, y, z]
      properties:
        x: { type: integer, minimum: 1 }
        y: { type: integer, minimum: 1 }
        z: { type: integer, minimum: 1 }
    PresenceSelection:
      type: object
      additionalProperties: false
      required: [min, max]
      properties:
        min: { $ref: '#/components/schemas/Coord' }
        max: { $ref: '#/components/schemas/Coord' }
      description: Normalized same-level inclusive bounds. Legacy sessions cap selection area at 4096 tiles; bulk-edit-v2 sessions permit whole-level selections within valid map dimensions.
