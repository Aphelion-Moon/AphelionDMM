version: 3

includes:
  task_win:
    taskfile: ./Taskfile_windows.yml
    optional: true

vars:
  GIT_VERSION:
    sh: git describe --tags --always
  GIT_REV:
    sh: git rev-parse --short HEAD
  # APHELION EDIT CHANGE - BRANDING - ORIGINAL: APP_NAME: StrongDMM
  APP_NAME: AphelionDMM
  BIN_DST: '{{.APP_NAME}}{{exeExt}}'
  BUILD_VARS: -X sdmm/internal/env.Version={{.GIT_VERSION}} -X sdmm/internal/env.Revision={{.GIT_REV}}
  LD_FLAGS_WINDOWS:
    sh: echo '{{if eq OS "windows"}}-H windowsgui -extldflags=-static{{end}}'
  LD_FLAGS: -s -w {{.BUILD_VARS}} {{.LD_FLAGS_WINDOWS}}
  BUILD_ARGS: -trimpath -ldflags="{{.LD_FLAGS}}"

tasks:
  default:
    cmds:
      - task: clean
      - task: build

  clean-parser:
    dir: third_party/sdmmparser/src
    cmds:
      - cargo clean

  clean-editor:
    cmds:
      - '{{if eq OS "windows"}}cmd /C "if exist dst (rmdir /S /Q dst)"{{else}}rm -frd ./dst{{end}}'

  clean:
    deps:
      - clean-parser
      - clean-editor

  build-parser:
    dir: third_party/sdmmparser/src
    vars:
      RUST_TARGET_DYN: "{{if eq .OS \"Windows_NT\"}}1.82.0-x86_64-pc-windows-gnu{{else}}1.82.0{{end}}"
      RUSTUP_TOOLCHAIN: "{{.RUST_TARGET | default .RUST_TARGET_DYN}}"
    cmds:
      - RUSTUP_TOOLCHAIN={{.RUSTUP_TOOLCHAIN}} cargo build --release --locked

  build-editor:
    cmds:
      - go build {{.BUILD_ARGS}} -o "dst/{{.BIN_DST}}" .

  build:
    cmds:
      - task: build-parser
      - task: build-editor

  test-go:
    cmds:
      - go test ./... -count=1

  test-rust:
    dir: third_party/sdmmparser/src
    vars:
      RUST_TARGET_DYN: "{{if eq .OS \"Windows_NT\"}}1.82.0-x86_64-pc-windows-gnu{{else}}1.82.0{{end}}"
      RUSTUP_TOOLCHAIN: "{{.RUST_TARGET | default .RUST_TARGET_DYN}}"
    cmds:
      - RUSTUP_TOOLCHAIN={{.RUSTUP_TOOLCHAIN}} cargo test --locked
      - RUSTUP_TOOLCHAIN={{.RUSTUP_TOOLCHAIN}} cargo fmt --all -- --check
      - RUSTUP_TOOLCHAIN={{.RUSTUP_TOOLCHAIN}} cargo clippy --all-targets --locked -- -D warnings

  lint:
    cmds:
      - golangci-lint run

  verify-contracts:
    cmds:
      - go test ./internal/aphelion/collab/protocol -run '^Test(Contracts|OpenAPI)' -count=1
      - go test ./internal/aphelion/buildcheck -count=1

  verify:
    cmds:
      - task: lint
      - task: verify-contracts
      - task: test-go
      - task: test-rust
      - task: build

  run:
    deps:
      - build-parser
    cmds:
      - go run {{.BUILD_ARGS}} .

  release-files-unzip:
    dir: dst
    cmds:
      - mkdir -p bin archive
      # APHELION EDIT ADDITION START - BRANDED RELEASE ASSETS
      - cp Windows/AphelionDMM.exe bin/apheliondmm-{{.GIT_VERSION}}-x86_64-pc-windows-gnu.exe
      - cp Linux/AphelionDMM bin/apheliondmm-{{.GIT_VERSION}}-x86_64-unknown-linux-gnu
      - cp macOS/AphelionDMM bin/apheliondmm-{{.GIT_VERSION}}-x86_64-apple-darwin
      - zip -rj archive/apheliondmm-windows.zip Windows
      - zip -rj archive/apheliondmm-linux.zip Linux
      - zip -rj archive/apheliondmm-macos.zip macOS
      # APHELION EDIT ADDITION END

  release-files-hash:
    dir: dst/bin
    cmds:
      - sha256sum ./apheliondmm-{{.GIT_VERSION}}-x86_64-pc-windows-gnu.exe | tee -a "apheliondmm-{{.GIT_VERSION}}-x86_64-pc-windows-gnu.exe.sha256"
      - sha256sum ./apheliondmm-{{.GIT_VERSION}}-x86_64-unknown-linux-gnu | tee -a "apheliondmm-{{.GIT_VERSION}}-x86_64-unknown-linux-gnu.sha256"
      - sha256sum ./apheliondmm-{{.GIT_VERSION}}-x86_64-apple-darwin | tee -a "apheliondmm-{{.GIT_VERSION}}-x86_64-apple-darwin.sha256"

  release-files:
    cmds:
      - task: release-files-unzip
      - task: release-files-hash
